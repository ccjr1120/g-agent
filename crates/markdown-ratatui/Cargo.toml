[package]
name = "codewandler-markdown-ratatui"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Render a markdown-stream event stream to ratatui Text (styled, width-aware, no ANSI round-trip)"
repository = "https://github.com/codewandler/markdown"

[lib]
name = "markdown_ratatui"
path = "src/lib.rs"

[dependencies]
markdown-stream = { package = "codewandler-markdown-stream", version = "0.2.1" }
ratatui = { version = "0.30", default-features = false }
unicode-width = "0.2"
